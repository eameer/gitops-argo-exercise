apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: loki-stack
    targetRevision: "2.10.2"
    helm:
      values: |
        loki:
          enabled: true
          persistence:
            enabled: false
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"

        promtail:
          enabled: true
          # kind's only node is the control-plane — DaemonSets need this toleration to schedule.
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Equal
              effect: NoSchedule
          config:
            # loki-stack defaults this to the release name ("monitoring"), not "monitoring-loki"
            lokiAddress: http://monitoring-loki:3100/loki/api/v1/push
          resources:
            requests:
              cpu: "25m"
              memory: "64Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"

        prometheus:
          enabled: true
          alertmanager:
            enabled: false
          pushgateway:
            enabled: false
          server:
            resources:
              requests:
                cpu: "50m"
                memory: "256Mi"
              limits:
                cpu: "200m"
                memory: "512Mi"
        grafana:
          enabled: true
          adminPassword: "grafana"   # local only — change for any shared environment
          ingress:
            enabled: true
            ingressClassName: nginx
            hosts:
              - grafana.127.0.0.1.nip.io
          datasources:
            datasources.yaml:
              apiVersion: 1
              datasources:
                - name: Loki
                  type: loki
                  url: http://monitoring-loki:3100
                  access: proxy
                  isDefault: true
                - name: Prometheus
                  type: prometheus
                  url: http://monitoring-prometheus-server.monitoring.svc:80
                  access: proxy
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
