apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mimir
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: mimir-distributed
    targetRevision: "5.5.1"
    helm:
      values: |
        # Simple scalable mode with filesystem storage — no object store needed locally.
        mimir:
          structuredConfig:
            multitenancy_enabled: false
            common:
              storage:
                backend: filesystem
                filesystem:
                  dir: /data
            blocks_storage:
              filesystem:
                dir: /data/blocks
            ruler_storage:
              filesystem:
                dir: /data/ruler
            alertmanager_storage:
              filesystem:
                dir: /data/alertmanager

        # Disable minio — using filesystem instead
        minio:
          enabled: false

        # 1 replica each — smallest footprint for local use
        write:
          replicas: 1
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"

        read:
          replicas: 1
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"

        backend:
          replicas: 1
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"

        # Disable self-monitoring to keep resource usage down
        metaMonitoring:
          dashboards:
            enabled: false
          rules:
            enabled: false
          serviceMonitor:
            enabled: false

        rollout_operator:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
