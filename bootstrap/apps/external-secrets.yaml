apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 0.9.14
    helm:
      values: |
        # The K8s service account name must match the WIF binding in Terraform:
        # google_service_account_iam_member.eso_wif binds
        # "serviceAccount:<project>.svc.id.goog[external-secrets/external-secrets]"
        serviceAccount:
          name: external-secrets
          annotations:
            iam.gke.io/gcp-service-account: ""  # Patched by ArgoCD from ClusterSecretStore
        installCRDs: true
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
