apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-app
  namespace: sample-app
  labels:
    app: sample-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sample-app
  template:
    metadata:
      labels:
        app: sample-app
    spec:
      containers:
        - name: sample-app
          # Managed by .github/workflows/app-build.yml — do not edit manually.
          # Format: ghcr.io/eameer/gitops-argo-exercise/sample-app:a5b09d16383a8de045190e4401f85b7429c79bdf
          # The workflow's sed step overwrites this line on every push to app/**
          image: ghcr.io/eameer/gitops-argo-exercise/sample-app:a5b09d16383a8de045190e4401f85b7429c79bdf
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
