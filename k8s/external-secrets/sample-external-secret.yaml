# ExternalSecret — syncs 'api-key' from the local K8s source secret into the sample-app namespace.
#
# The source secret must exist before this can resolve:
#   kubectl create secret generic app-source-secrets \
#     -n external-secrets --from-literal=api-key=local-dev-key
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: my-app-secret
  namespace: sample-app
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: local-k8s-store
    kind: ClusterSecretStore
  target:
    name: my-app-secret
    creationPolicy: Owner
  data:
    - secretKey: api-key              # Key name in the resulting K8s Secret
      remoteRef:
        key: app-source-secrets       # Name of the source K8s Secret in external-secrets ns
        property: api-key             # Key within that secret
