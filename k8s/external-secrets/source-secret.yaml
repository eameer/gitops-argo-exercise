# Source secret — this is the "external" secret store for local development.
# ESO's kubernetes provider reads from this secret and syncs its keys to other namespaces.
#
# DO NOT commit real credentials here. Create this secret manually once:
#
#   kubectl create secret generic app-source-secrets \
#     -n external-secrets \
#     --from-literal=api-key=local-dev-key
#
# This file is provided as a reference showing the expected keys.
# It is listed in .gitignore and should never be applied directly from Git.
#
# To update a value:
#   kubectl patch secret app-source-secrets -n external-secrets \
#     -p '{"stringData": {"api-key": "new-value"}}'
#
# ExternalSecret objects in other namespaces will pick up the change within
# the refreshInterval (default: 1h). To force immediate refresh:
#   kubectl annotate externalsecret my-app-secret -n sample-app \
#     force-sync=$(date +%s) --overwrite
