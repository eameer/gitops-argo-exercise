# ClusterSecretStore — ESO reads from a K8s Secret in the 'external-secrets' namespace.
#
# This uses the ESO 'kubernetes' provider so no external cloud credentials are needed.
# The source secret is created manually once (never committed to Git):
#
#   kubectl create secret generic app-source-secrets \
#     -n external-secrets \
#     --from-literal=api-key=local-dev-key
#
# ESO syncs keys from that secret into other namespaces via ExternalSecret objects.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: local-k8s-store
spec:
  provider:
    kubernetes:
      # Namespace where the source secrets live
      remoteNamespace: external-secrets
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
          namespace: external-secrets
      auth:
        serviceAccount:
          name: external-secrets
          namespace: external-secrets
