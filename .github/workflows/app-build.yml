name: Build & Deploy App

on:
  push:
    branches:
      - main
    paths:
      - "app/**"

permissions:
  contents: write  # To commit the updated image tag back to the repo
  packages: write  # To push to GHCR

jobs:
  build-and-push:
    name: Build, Push & Update Manifest
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # GITHUB_TOKEN is built-in — no secrets needed for GHCR auth.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tag
        id: tag
        run: echo "IMAGE_TAG=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./app
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/sample-app:${{ steps.tag.outputs.IMAGE_TAG }}
            ghcr.io/${{ github.repository }}/sample-app:latest

      # Update the image tag in the K8s manifest and commit back.
      # ArgoCD detects the change and syncs automatically.
      - name: Update image tag in manifest
        run: |
          sed -i "s|ghcr.io/.*/sample-app:.*|ghcr.io/${{ github.repository }}/sample-app:${{ steps.tag.outputs.IMAGE_TAG }}|" \
            k8s/sample-app/deployment.yaml

      - name: Commit updated manifest
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/sample-app/deployment.yaml
          git commit -m "chore: update sample-app image to ${{ steps.tag.outputs.IMAGE_TAG }}"
          git push
