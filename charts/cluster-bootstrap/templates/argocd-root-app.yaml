{{- if .Values.rootApp.repoURL }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  annotations:
    # post-install/upgrade hook so this is applied after ArgoCD's CRDs are installed
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "10"
    # only delete before re-creation — keep the Application alive after the hook runs
    helm.sh/hook-delete-policy: before-hook-creation
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: {{ .Values.rootApp.repoURL | quote }}
    targetRevision: {{ .Values.rootApp.targetRevision | quote }}
    path: bootstrap/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
{{- end }}
